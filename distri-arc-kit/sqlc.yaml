version: "2"
sql:
  - engine: postgresql
    schema:
      - db/migrations/0001_init.sql
      - db/migrations/0002_river.sql
      - db/migrations/0003_whatsapp.sql
      - db/migrations/0004_odoo.sql
      - db/migrations/0005_proposals.sql
      - db/migrations/0006_orchestrator.sql
      - db/migrations/0007_mcp.sql
      - db/migrations/0008_relasi.sql
      - db/migrations/0009_identify.sql
      - db/migrations/0010_memory.sql
      - db/migrations/0011_hardening.sql
      - db/migrations/0012_pilot.sql
      - db/migrations/0013_wa_accounts.sql
      - db/migrations/0014_master_data.sql
      - db/migrations/0015_roles_access.sql
      - db/migrations/0016_roles_custom_branches_wa_links.sql
      - db/migrations/0017_mcp_oauth.sql
      - db/migrations/0018_mcp_schedules.sql
      - db/migrations/0019_sales_merge.sql
      - db/migrations/0020_wa_analysis.sql
      - db/migrations/0021_wa_message_insights.sql
      - db/migrations/0022_chat_from_number_index.sql
      - db/migrations/0023_wa_state_since.sql
      - db/migrations/0024_wa_history_year.sql
      - db/migrations/0025_chat_media_edit.sql
      - db/migrations/0026_screen_analyses.sql
      - db/migrations/0027_chat_reply.sql
      - db/migrations/0028_chat_delete.sql
      - db/migrations/0029_chat_outgoing_files.sql
      - db/migrations/0030_analysis_mcp_only.sql
      - db/migrations/0031_wa_teams_customer_groups.sql
      - db/migrations/0032_customer_groups_outsiders.sql
      - db/migrations/0033_holding_replies.sql
      - db/migrations/0034_chat_queue_cleanup.sql
      - db/migrations/0035_wa_analysis_schedule.sql
      - db/migrations/0036_reply_rules.sql
      - db/migrations/0037_wa_analysis_external.sql
    queries: db/queries
    gen:
      go:
        package: gen
        out: internal/store/gen
        sql_package: pgx/v5
        emit_json_tags: true
        json_tags_case_style: snake
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
