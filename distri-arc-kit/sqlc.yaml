version: "2"
sql:
  - engine: postgresql
    schema:
      - db/migrations/0001_init.sql
      - db/migrations/0002_river.sql
      - db/migrations/0003_whatsapp.sql
      - db/migrations/0004_odoo.sql
      - db/migrations/0005_proposals.sql
      - db/migrations/0006_orchestrator.sql
      - db/migrations/0007_mcp.sql
      - db/migrations/0008_relasi.sql
      - db/migrations/0009_identify.sql
    queries: db/queries
    gen:
      go:
        package: gen
        out: internal/store/gen
        sql_package: pgx/v5
        emit_json_tags: true
        json_tags_case_style: snake
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - db_type: jsonb
            nullable: true
            go_type: encoding/json.RawMessage
