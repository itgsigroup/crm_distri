name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: arc, POSTGRES_PASSWORD: arc, POSTGRES_DB: distri_arc_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U arc" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://arc:arc@localhost:5432/distri_arc_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }
      - run: cd web && npm ci
      - run: go vet ./... && go test ./...
      - run: cd web && npm run lint && npm run typecheck && npm test
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: npm audit (production dependencies)
        run: cd web && npm audit --omit=dev --audit-level=high
      - name: check-env rejects a production config with dev shortcuts
        run: |
          go build -o bin/arc ./cmd/arc
          if APP_ENV=prod ARC_NOW=2026-10-05T06:45+07 DATABASE_URL=$DATABASE_URL_TEST bin/arc ctl check-env; then
            echo "check-env accepted a bad production config" >&2; exit 1
          fi
