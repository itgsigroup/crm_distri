# pre-commit install  → runs on every commit
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'out=$(gofmt -l apps packages); [ -z "$out" ] || { echo "$out"; exit 1; }'
        language: system
        pass_filenames: false
        files: \.go$
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        files: \.go$
